# Copy to secrets.yaml (git-ignored) and fill in. The ESPHome dashboard has its own
# secrets.yaml; if you build there, put these keys in that one instead.
wifi_ssid: "your-ssid"
wifi_password: "your-wifi-password"
api_encryption_key: "generate with: esphome generate-api-key  (or copy from a dashboard device)"
ota_password: "choose-a-password"
